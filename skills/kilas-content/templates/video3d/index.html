<title>3D explainer scene</title>

<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="ov"></div>
</div>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script type="module" src="scene.js"></script>
<script type="module">
  // preview loop for the dev page only (?t= renders one still; ?from=&to= loops a range)
  const qs = new URLSearchParams(location.search);
  if (!qs.has("t")) {
    const go = () => { const t0 = performance.now(), from = +(qs.get("from") || 0), to = +(qs.get("to") || 60);
      const f = () => { window.__render(from + ((performance.now() - t0) / 1000) % (to - from)); requestAnimationFrame(f); }; f(); };
    const wait = () => (window.__render ? go() : setTimeout(wait, 50));
    wait();
  }
</script>
</body>
</html>
