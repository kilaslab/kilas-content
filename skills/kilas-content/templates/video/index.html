<!doctype html>
<!--
  HyperFrames shell for a Reel built with rig.js (references/motion-video.md, step 5).
  Copy into the project made by `npx hyperframes init <item>/video --skip-skills`, then:
  1. paste rig.js and your scene code where marked (one <script>: HyperFrames lint wants the
     timeline built and registered in the same block);
  2. set DURATION on the root and the stage, one <audio> per VO clip with its measured length
     (vo_elevenlabs.py prints it);
  3. put the display font file in assets/fonts/ (fonts outside the bundled list need @font-face).
  Then: npx hyperframes check --json · snapshot --at ... · render -q delivery -o ../export/<name>.mp4
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Display"; src: url("assets/fonts/Display.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #faf6ee; }
      #root { position: relative; width: 100%; height: 100%; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-layout-allow-overlap data-layout-allow-overflow>
      <svg id="stage" class="clip" data-start="0" data-duration="30" data-track-index="1" viewBox="0 0 1080 1920" data-layout-allow-overlap data-layout-allow-overflow></svg>
      <audio id="vo0" class="clip" src="assets/vo0.mp3" data-start="0.1" data-duration="3.2" data-track-index="10" data-volume="1"></audio>
      <!-- one <audio id="voN"> per beat, start = the beat's start, duration = the clip's measured length -->
    </div>
    <script>
      /* ---- paste templates/video/rig.js here ---- */

      /* ---- scene ---- */
      const svg = document.getElementById("stage");
      const R = KilasRig.create(svg, { palette: { accent: "#14786B", mascot: "#22A08F" } });
      const tl = gsap.timeline({ paused: true });
      const A = KilasRig.acting(tl);
      // build the panels, cast and beats here; end with:
      A.finish();
      tl.to({}, { duration: 0.01 }, 30);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
